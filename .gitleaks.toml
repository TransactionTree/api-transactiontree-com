# Gitleaks config for api.transactiontree.com
# Extends the default ruleset. No allowlist: the stale credentials from the
# initial portal mirror were scrubbed, so nothing in the collection is exempt.

[extend]
useDefault = true

[[rules]]
id = "vrg-sectoken-literal"
description = "Literal VRG sectoken value (use the {{sectoken}} variable instead)"
regex = '''sectoken=(?:[A-Za-z0-9+/=%_-]{16,})'''
keywords = ["sectoken"]

[[rules]]
id = "postman-password-literal"
description = "Literal password value in a Postman query/body (use {{password}} or <string>)"
regex = '''(?i)"key"\s*:\s*"[a-z_]*pass[a-z_]*"\s*,\s*"value"\s*:\s*"[^"<{][^"]{3,}"'''
keywords = ["pass"]
