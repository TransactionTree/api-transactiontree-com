name: PR checks

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  json-valid:
    name: Collection JSON parses
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - run: |
          jq -e . postman/collection.json > /dev/null
          echo "OK — items=$(jq '.collection.item | length' postman/collection.json) bytes=$(stat -c %s postman/collection.json)"

  schema-agreement:
    name: Bodies and examples match the published schemas
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      # The portal links to TransactionTree/transactiontree-schemas at main, so it is checked
      # against main. Standard-library Python plus the distribution's xmllint; nothing from PyPI.
      - name: Validate request bodies and saved examples
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq libxml2-utils
          git clone --quiet --depth 1 https://github.com/TransactionTree/transactiontree-schemas.git "$RUNNER_TEMP/schemas"
          echo "schemas at $(git -C "$RUNNER_TEMP/schemas" rev-parse --short HEAD)"
          python3 scripts/validate_against_schemas.py postman/collection.json "$RUNNER_TEMP/schemas"

  internal-leak-scan:
    name: Internal-leak scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - run: bash scripts/internal-leak-check.sh postman/collection.json

  gitleaks:
    name: Gitleaks secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      # gitleaks-action@v2 needs a paid licence for organisation repos, so run the
      # pinned OSS binary. Scans the files as they will be published (--no-git);
      # the initial mirror commit still holds the old values in history.
      - name: Gitleaks (working tree)
        env:
          GITLEAKS_VERSION: 8.18.4
          GITLEAKS_SHA256: ba6dbb656933921c775ee5a2d1c13a91046e7952e9d919f9bac4cec61d628e7d
        run: |
          curl -sSfL -o gitleaks.tar.gz "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  gitleaks.tar.gz" | sha256sum -c -
          tar -xzf gitleaks.tar.gz gitleaks && rm gitleaks.tar.gz
          ./gitleaks detect --source . --no-git --config .gitleaks.toml --redact --verbose
