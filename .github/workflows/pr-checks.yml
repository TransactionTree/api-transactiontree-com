name: PR checks

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  json-valid:
    name: Collection JSON parses
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          jq -e . postman/collection.json > /dev/null
          echo "OK — items=$(jq '.collection.item | length' postman/collection.json) bytes=$(stat -c %s postman/collection.json)"

  internal-leak-scan:
    name: Internal-leak scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: bash scripts/internal-leak-check.sh postman/collection.json

  gitleaks:
    name: Gitleaks secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
