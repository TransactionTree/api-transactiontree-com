name: Publish to Postman

# Phase 1 (initial bring-up): manual trigger only — flip the auto trigger on
# after a successful manual test and after CI API key is confirmed working.
#
# To enable auto-publish on merge, add to the `on:` block below:
#   push:
#     branches: [main]
#     paths:
#       - 'postman/collection.json'
#       - '.github/workflows/publish-to-postman.yml'
on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Validate only — do not actually push to Postman"
        required: false
        default: "false"
        type: choice
        options: ["false", "true"]

permissions:
  contents: read

env:
  # Postman collection that backs https://api.transactiontree.com (published doc id 2sBYAq1Dve).
  # Verified 2026-10-08 from the portal page's collectionId. The old 6363906-51a49200-… collection
  # is "TransactionTree - LEGACY" and is no longer published.
  POSTMAN_COLLECTION_ID: "6363906-32d79127-a4bd-4cf8-8d88-1357be996089"
  COLLECTION_FILE: "postman/collection.json"

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Validate JSON parses
        run: |
          jq -e . "$COLLECTION_FILE" > /dev/null
          echo "JSON valid — bytes=$(stat -c %s $COLLECTION_FILE) items=$(jq '.collection.item | length' $COLLECTION_FILE)"

      - name: Internal-leak scan
        run: bash scripts/internal-leak-check.sh "$COLLECTION_FILE"

      - name: Gitleaks
        env:
          GITLEAKS_VERSION: 8.18.4
          GITLEAKS_SHA256: ba6dbb656933921c775ee5a2d1c13a91046e7952e9d919f9bac4cec61d628e7d
        run: |
          curl -sSfL -o gitleaks.tar.gz "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  gitleaks.tar.gz" | sha256sum -c -
          tar -xzf gitleaks.tar.gz gitleaks && rm gitleaks.tar.gz
          ./gitleaks detect --source . --no-git --config .gitleaks.toml --redact --verbose

      - name: Read the live Postman collection
        env:
          POSTMAN_API_KEY: ${{ secrets.POSTMAN_API_KEY }}
        run: |
          if [[ -z "$POSTMAN_API_KEY" ]]; then
            echo "::error::POSTMAN_API_KEY secret is not set — configure in repo settings before publishing."
            exit 1
          fi
          # Saved outside the checkout so gitleaks never scans it and nothing uploads it.
          http_status=$(curl -sS -o "$RUNNER_TEMP/live-before.json" -w "%{http_code}" \
            -H "X-Api-Key: $POSTMAN_API_KEY" \
            "https://api.getpostman.com/collections/$POSTMAN_COLLECTION_ID")
          if [[ "$http_status" != "200" ]]; then
            echo "::error::Could not read the live collection (HTTP $http_status)"
            exit 1
          fi

      - name: Refuse to drop anything that is live
        # Fails if Postman has any folder, request or saved example that this repo does not,
        # i.e. someone edited the collection directly in Postman. Publishing would delete it.
        run: python3 scripts/postman_guard.py drift "$RUNNER_TEMP/live-before.json" "$COLLECTION_FILE"

      - name: Push to Postman
        if: ${{ inputs.dry_run != 'true' }}
        env:
          POSTMAN_API_KEY: ${{ secrets.POSTMAN_API_KEY }}
        run: |
          # The Postman PUT endpoint expects the body shape {"collection": <full collection object>}.
          # Our file already wraps under .collection at the top level (that's what the GET endpoint returns),
          # so we can use it directly.
          http_status=$(curl -sS -o response.json -w "%{http_code}" \
            -X PUT \
            -H "X-Api-Key: $POSTMAN_API_KEY" \
            -H "Content-Type: application/json" \
            --data-binary "@$COLLECTION_FILE" \
            "https://api.getpostman.com/collections/$POSTMAN_COLLECTION_ID")
          echo "HTTP $http_status"
          cat response.json
          echo
          if [[ "$http_status" != "200" ]]; then
            echo "::error::Postman PUT failed with HTTP $http_status"
            exit 1
          fi

      - name: Confirm Postman now matches the repo
        if: ${{ inputs.dry_run != 'true' }}
        env:
          POSTMAN_API_KEY: ${{ secrets.POSTMAN_API_KEY }}
        run: |
          curl -sSf -o "$RUNNER_TEMP/live-after.json" -H "X-Api-Key: $POSTMAN_API_KEY" \
            "https://api.getpostman.com/collections/$POSTMAN_COLLECTION_ID"
          python3 scripts/postman_guard.py match "$COLLECTION_FILE" "$RUNNER_TEMP/live-after.json"

      - name: Dry run notice
        if: ${{ inputs.dry_run == 'true' }}
        run: echo "DRY RUN — validations passed, no push to Postman performed."
